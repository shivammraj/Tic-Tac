<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Space+Mono:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary": "#68000c",
                    "error-container": "#93000a",
                    "surface-dim": "#131411",
                    "surface-bright": "#3a3936",
                    "on-primary-container": "#5c0009",
                    "surface": "#131411",
                    "on-primary-fixed-variant": "#900a18",
                    "surface-container": "#20201d",
                    "outline-variant": "#59413f",
                    "on-surface-variant": "#e1bebc",
                    "tertiary-container": "#c98100",
                    "on-primary-fixed": "#410004",
                    "on-surface": "#e5e2dd",
                    "surface-container-low": "#1c1c19",
                    "secondary": "#a4c9ff",
                    "surface-variant": "#353532",
                    "inverse-on-surface": "#31302d",
                    "on-tertiary": "#462a00",
                    "surface-container-high": "#2a2a27",
                    "secondary-fixed": "#d4e3ff",
                    "primary": "#ffb3ae",
                    "background": "#131411",
                    "on-tertiary-fixed-variant": "#653e00",
                    "surface-tint": "#ffb3ae",
                    "surface-container-highest": "#353532",
                    "tertiary": "#ffb95d",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#2a1700",
                    "inverse-primary": "#b3282c",
                    "tertiary-fixed": "#ffddb7",
                    "on-background": "#e5e2dd",
                    "inverse-surface": "#e5e2dd",
                    "on-tertiary-container": "#3d2400",
                    "on-secondary": "#00315d",
                    "surface-container-lowest": "#0e0e0c",
                    "secondary-fixed-dim": "#a4c9ff",
                    "on-secondary-container": "#a3c8ff",
                    "on-secondary-fixed": "#001c39",
                    "outline": "#a98987",
                    "primary-container": "#f85b58",
                    "error": "#ffb4ab",
                    "primary-fixed-dim": "#ffb3ae",
                    "tertiary-fixed-dim": "#ffb95d",
                    "secondary-container": "#005398",
                    "primary-fixed": "#ffdad7",
                    "on-secondary-fixed-variant": "#004883",
                    "on-error-container": "#ffdad6",
                    "game-red": "#E24B4A",
                    "game-blue": "#185FA5",
                    "game-cell": "#1A1A1A",
                    "game-border": "#2A2A2A"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "xs": "4px",
                    "grid-gap": "12px",
                    "unit": "4px",
                    "sm": "8px",
                    "lg": "24px",
                    "xl": "40px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "display-xl": ["Black Han Sans"],
                    "display-lg": ["Black Han Sans"],
                    "headline-md": ["Space Mono"],
                    "label-caps": ["Space Mono"],
                    "body-lg": ["Space Mono"],
                    "body-sm": ["Space Mono"]
            },
            "fontSize": {
                    "display-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0D0D0D;
            color: #E5E2DD;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .cell-glow {
            box-shadow: 0 0 15px rgba(226, 75, 74, 0.4);
            border-color: #E24B4A !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen font-body-lg antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-surface-variant dark:border-surface-variant flex justify-between items-center px-container-padding h-16 w-full max-w-[480px] mx-auto sticky top-0 z-50">
<button class="text-on-surface-variant hover:bg-surface-container transition-colors duration-150 ease-in-out p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display-lg text-display-lg text-on-surface dark:text-on-surface tracking-tighter">TICTAC</h1>
<button class="text-on-surface-variant hover:bg-surface-container transition-colors duration-150 ease-in-out p-2 rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="flex-1 w-full max-w-[480px] mx-auto px-container-padding pt-md pb-xl">
<!-- Turn Indicator Row -->
<div class="flex items-center justify-center gap-sm mb-xl py-md bg-game-cell border border-game-border rounded-lg">
<div class="w-3 h-3 rounded-full bg-game-red"></div>
<span class="font-label-caps text-label-caps text-on-surface tracking-widest uppercase">X's Turn</span>
</div>
<!-- Game Board Container -->
<div class="relative w-full aspect-square mb-xl">
<div class="game-grid h-full">
<!-- Row 1 -->
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<span class="font-display-xl text-display-xl text-game-red leading-none select-none">X</span>
</div>
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<span class="font-display-xl text-display-xl text-game-blue leading-none select-none">O</span>
</div>
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high cell-glow">
<span class="font-display-xl text-display-xl text-game-red leading-none select-none">X</span>
</div>
<!-- Row 2 -->
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<span class="font-display-xl text-display-xl text-game-blue leading-none select-none">O</span>
</div>
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<span class="font-display-xl text-display-xl text-game-red leading-none select-none">X</span>
</div>
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<!-- Empty Cell -->
</div>
<!-- Row 3 -->
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<!-- Empty Cell -->
</div>
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<span class="font-display-xl text-display-xl text-game-blue leading-none select-none">O</span>
</div>
<div class="bg-game-cell border border-game-border rounded-lg flex items-center justify-center aspect-square transition-colors active:bg-surface-container-high">
<!-- Empty Cell -->
</div>
</div>
</div>
<!-- Score Bar -->
<div class="grid grid-cols-3 gap-md mb-xl">
<div class="flex flex-col items-center p-md bg-game-cell border border-game-border rounded-lg">
<span class="font-label-caps text-label-caps text-game-red mb-xs">PLAYER X</span>
<span class="font-headline-md text-headline-md text-on-surface">12</span>
</div>
<div class="flex flex-col items-center p-md bg-game-cell border border-game-border rounded-lg">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs">DRAWS</span>
<span class="font-headline-md text-headline-md text-on-surface">4</span>
</div>
<div class="flex flex-col items-center p-md bg-game-cell border border-game-border rounded-lg">
<span class="font-label-caps text-label-caps text-game-blue mb-xs">PLAYER O</span>
<span class="font-headline-md text-headline-md text-on-surface">09</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-on-surface text-surface py-md rounded-full font-headline-md text-headline-md uppercase tracking-tighter active:scale-95 transition-transform duration-100">
            New Game
        </button>
</main>
<!-- BottomNavBar (Suppressed for focused game task but structure maintained for shell consistency) -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] flex justify-around items-center h-20 px-lg bg-surface dark:bg-surface border-t-2 border-on-surface dark:border-on-surface z-50">
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-50 active:scale-95 transition-transform duration-100 cursor-pointer">
<span class="material-symbols-outlined">home</span>
</div>
<div class="flex flex-col items-center justify-center text-primary dark:text-primary scale-110 active:scale-95 transition-transform duration-100 cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sports_esports</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-50 active:scale-95 transition-transform duration-100 cursor-pointer">
<span class="material-symbols-outlined">history</span>
</div>
</nav>
</body></html>
