<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Space+Mono:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary": "#68000c",
                    "error-container": "#93000a",
                    "surface-dim": "#131411",
                    "surface-bright": "#3a3936",
                    "on-primary-container": "#5c0009",
                    "surface": "#131411",
                    "on-primary-fixed-variant": "#900a18",
                    "surface-container": "#20201d",
                    "outline-variant": "#59413f",
                    "on-surface-variant": "#e1bebc",
                    "tertiary-container": "#c98100",
                    "on-primary-fixed": "#410004",
                    "on-surface": "#e5e2dd",
                    "surface-container-low": "#1c1c19",
                    "secondary": "#a4c9ff",
                    "surface-variant": "#353532",
                    "inverse-on-surface": "#31302d",
                    "on-tertiary": "#462a00",
                    "surface-container-high": "#2a2a27",
                    "secondary-fixed": "#d4e3ff",
                    "primary": "#ffb3ae",
                    "background": "#131411",
                    "on-tertiary-fixed-variant": "#653e00",
                    "surface-tint": "#ffb3ae",
                    "surface-container-highest": "#353532",
                    "tertiary": "#ffb95d",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#2a1700",
                    "inverse-primary": "#b3282c",
                    "tertiary-fixed": "#ffddb7",
                    "on-background": "#e5e2dd",
                    "inverse-surface": "#e5e2dd",
                    "on-tertiary-container": "#3d2400",
                    "on-secondary": "#00315d",
                    "surface-container-lowest": "#0e0e0c",
                    "secondary-fixed-dim": "#a4c9ff",
                    "on-secondary-container": "#a3c8ff",
                    "on-secondary-fixed": "#001c39",
                    "outline": "#a98987",
                    "primary-container": "#f85b58",
                    "error": "#ffb4ab",
                    "primary-fixed-dim": "#ffb3ae",
                    "tertiary-fixed-dim": "#ffb95d",
                    "secondary-container": "#005398",
                    "primary-fixed": "#ffdad7",
                    "on-secondary-fixed-variant": "#004883",
                    "on-error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "xs": "4px",
                    "grid-gap": "12px",
                    "unit": "4px",
                    "sm": "8px",
                    "lg": "24px",
                    "xl": "40px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "display-xl": ["Black Han Sans"],
                    "display-lg": ["Black Han Sans"],
                    "headline-md": ["Space Mono"],
                    "label-caps": ["Space Mono"],
                    "body-lg": ["Space Mono"],
                    "body-sm": ["Space Mono"]
            },
            "fontSize": {
                    "display-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0D0D0D;
            color: #e5e2dd;
            font-family: 'Space Mono', monospace;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-grid-bg {
            background-image: radial-gradient(#2A2A2A 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen items-center overflow-x-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-padding h-16 w-full max-w-[480px] mx-auto border-b border-surface-variant dark:border-surface-variant bg-surface dark:bg-surface">
<div class="flex items-center justify-center h-10 w-10 transition-colors duration-150 ease-in-out hover:bg-surface-container dark:hover:bg-surface-container text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">grid_view</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface dark:text-on-surface tracking-tighter">TICTAC</h1>
<div class="flex items-center justify-center h-10 w-10 transition-colors duration-150 ease-in-out hover:bg-surface-container dark:hover:bg-surface-container text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-[480px] px-container-padding py-xl gap-xl custom-grid-bg">
<!-- Hero Branding Section -->
<div class="text-center">
<h2 class="font-display-xl text-display-xl tracking-[4px] text-on-surface mb-sm">TICTAC</h2>
<p class="font-body-lg text-body-lg text-on-surface opacity-80">The classic game, reimagined</p>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-md mt-md">
<button class="w-full py-md bg-[#F0EDE8] text-[#0D0D0D] rounded-lg font-headline-md text-headline-md flex items-center justify-center gap-sm active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">group</span>
                Play vs Friend
            </button>
<button class="w-full py-md bg-transparent border-2 border-[#F0EDE8] text-[#F0EDE8] rounded-lg font-headline-md text-headline-md flex items-center justify-center gap-sm active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">smart_toy</span>
                Play vs AI
            </button>
</div>
<!-- Score History Card -->
<div class="w-full bg-[#1A1A1A] border border-[#2A2A2A] rounded-xl p-lg flex flex-col gap-md">
<div class="flex items-center justify-between border-b border-[#2A2A2A] pb-sm">
<span class="font-label-caps text-label-caps opacity-60">Global Score History</span>
<span class="material-symbols-outlined text-body-sm opacity-40">trending_up</span>
</div>
<div class="grid grid-cols-3 gap-sm">
<!-- X Wins -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-primary">X WINS</span>
<div class="w-full bg-[#2A2A2A] py-sm rounded flex items-center justify-center">
<span class="font-headline-md text-headline-md text-primary">24</span>
</div>
</div>
<!-- Draws -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-tertiary">DRAWS</span>
<div class="w-full bg-[#2A2A2A] py-sm rounded flex items-center justify-center">
<span class="font-headline-md text-headline-md text-tertiary">18</span>
</div>
</div>
<!-- O Wins -->
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-secondary">O WINS</span>
<div class="w-full bg-[#2A2A2A] py-sm rounded flex items-center justify-center">
<span class="font-headline-md text-headline-md text-secondary">31</span>
</div>
</div>
</div>
</div>
<!-- Secondary Navigation/Links -->
<div class="w-full grid grid-cols-2 gap-sm">
<div class="flex items-center justify-center bg-[#1A1A1A] border border-[#2A2A2A] p-md rounded-lg gap-sm opacity-80 hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-on-surface">emoji_events</span>
<span class="font-body-sm text-body-sm">Leaderboard</span>
</div>
<div class="flex items-center justify-center bg-[#1A1A1A] border border-[#2A2A2A] p-md rounded-lg gap-sm opacity-80 hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-on-surface">person</span>
<span class="font-body-sm text-body-sm">Profile</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] flex justify-around items-center h-20 px-lg bg-surface dark:bg-surface border-t-2 border-on-surface dark:border-on-surface z-50">
<!-- Home (Active) -->
<div class="flex flex-col items-center justify-center text-primary dark:text-primary scale-110 active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps mt-xs">home</span>
</div>
<!-- Play -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-50 active:scale-95 transition-transform duration-100 hover:bg-surface-container-high dark:hover:bg-surface-container-high p-sm rounded">
<span class="material-symbols-outlined">sports_esports</span>
<span class="font-label-caps text-label-caps mt-xs">play</span>
</div>
<!-- History -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-50 active:scale-95 transition-transform duration-100 hover:bg-surface-container-high dark:hover:bg-surface-container-high p-sm rounded">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caps text-label-caps mt-xs">history</span>
</div>
</nav>
<!-- Spacer for fixed BottomNavBar -->
<div class="h-20 w-full"></div>
</body></html>
